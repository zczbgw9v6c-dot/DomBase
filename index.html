<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DomBase — base de données DOM-TOM</title>
<meta name="theme-color" content="#102A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DomBase">
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<link rel="icon" type="image/png" href="apple-touch-icon.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --fond:#F8F9F9; --carte:#FFFFFF; --trait:#E1E7E7;
  --encre:#102A2E; --encre-2:#3A5155; --encre-3:#738589;
  --bleu:#1E7A8C; --bleu-clair:#57B0BE; --bleu-pale:#E7F2F4; --bleu-fonce:#115765;
  --ambre:#8A6014; --ambre-pale:#FAF3E4; --ambre-trait:#EFE2C6;
  --vert:#3F8F6B; --vert-pale:#E9F3EE;
  --rouge:#A23B2E; --rouge-pale:#FBEAE7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--encre);
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px}
p{margin:0 0 10px}

/* connexion */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--encre)}
.gbox{background:var(--carte);border-radius:14px;padding:30px 28px;width:min(400px,100%);
  transform:translateY(6px);opacity:0;animation:rise .5s .05s ease forwards}
@keyframes rise{to{transform:none;opacity:1}}
.gbox.leaving{transition:transform .3s,opacity .3s;transform:translateY(-6px);opacity:0}
#gate,#app{transition:opacity .45s ease}
#gate.out{opacity:0;pointer-events:none}
#app.in{opacity:0}
.gerr{color:var(--rouge);font-size:13px;margin-top:8px;min-height:18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}

/* shell */
.top{background:var(--carte);border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.topin{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo span{color:var(--bleu-clair)}
.burger{background:none;border:0;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:8px}
.burger:hover{background:var(--bleu-pale)}
.burger span{display:block;width:18px;height:2px;background:var(--encre);border-radius:2px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--encre-2);cursor:pointer;font-weight:500;white-space:nowrap;
  transition:background .2s,color .2s,transform .15s}
.tab:hover{background:var(--bleu-pale)} .tab:active{transform:scale(.96)}
.tab.on{background:var(--encre);color:#fff}
.tab .n{font-size:12px;margin-left:5px;opacity:.6}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--encre-3)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px}
#view.sw{animation:swap .34s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* atoms */
.btn{background:var(--bleu);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:none;color:var(--encre);border:1px solid var(--trait)}
.btn.g:hover{background:var(--bleu-pale);filter:none}
.btn.sm{padding:6px 11px;font-size:13.5px;font-weight:500}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:18px}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--trait);border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bleu);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:12.5px;color:var(--encre-3);margin-bottom:4px}
.field{margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--fond);color:var(--encre-2);border:1px solid var(--trait);white-space:nowrap}
.tag.b{background:var(--bleu-pale);color:var(--bleu-fonce);border-color:#C6E0E5}
.tag.v{background:var(--vert-pale);color:var(--vert);border-color:#CDE4DA}
.tag.a{background:var(--ambre-pale);color:var(--ambre);border-color:var(--ambre-trait)}
.tag.r{background:var(--rouge-pale);color:var(--rouge);border-color:#E8C9C4}
.mut{color:var(--encre-3)} .sm{font-size:13.5px} .xs{font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--encre-3);border:1px dashed var(--trait);border-radius:var(--r);background:var(--carte)}
.empty b{display:block;color:var(--encre);margin-bottom:6px}
.hr{height:1px;background:var(--trait);border:0;margin:16px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--encre-2)}
.chip.on{background:var(--encre);color:#fff;border-color:var(--encre)}

/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;
  justify-content:space-between;min-height:112px;transition:transform .16s,box-shadow .16s,border-color .16s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,42,46,.09);border-color:#C6D6D8}
.tile:active{transform:scale(.98)}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1}
.tile .k{font-size:13px;color:var(--encre-2);font-weight:500;margin-top:8px;line-height:1.3}
.tile .s{font-size:11.5px;color:var(--encre-3);margin-top:2px}
.tile.dark{background:var(--encre);border-color:var(--encre)} .tile.dark .v{color:#fff} .tile.dark .k{color:#BCD4D8} .tile.dark .s{color:#88A2A6}
.tile.b{background:var(--bleu-pale);border-color:#C6E0E5} .tile.b .v{color:var(--bleu-fonce)}
.tile.v{background:var(--vert-pale);border-color:#CDE4DA} .tile.v .v{color:var(--vert)}
.tile.a{background:var(--ambre-pale);border-color:var(--ambre-trait)} .tile.a .v{color:var(--ambre)}
.secth{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.secth h2{font-size:15px}
.secth span{font-size:12.5px;color:var(--encre-3)}
.bar{height:6px;background:var(--fond);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bleu)}
.jauge{height:10px;background:var(--fond);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu-clair),var(--bleu));transition:width .4s}

/* tableau */
.tw{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:9px 12px;color:var(--encre-3);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--trait);
  white-space:nowrap;background:var(--carte);position:sticky;top:0;cursor:pointer;user-select:none}
th.s{color:var(--encre)}
td{padding:9px 12px;border-bottom:1px solid #F1F4F4;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#F6FAFA}
tbody tr.sel{background:var(--bleu-pale)}
td.ck,th.ck{width:34px;padding-right:0}
td .who2{font-weight:600}
td .sub{font-size:12px;color:var(--encre-3)}
.more{text-align:center;padding:12px}
.mc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.lst{display:flex;flex-direction:column;gap:8px}

/* fiche client */
.hero{position:relative;background:linear-gradient(135deg,var(--encre),#1B4A52);color:#fff;border-radius:14px;padding:20px 20px 18px;margin:-4px 0 6px}
.hero .tag{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff}
.hero .tag.v{background:rgba(63,143,107,.35)} .hero .tag.b{background:rgba(87,176,190,.3)} .hero .tag.a{background:rgba(240,196,106,.3)} .hero .tag.r{background:rgba(162,59,46,.4)}
.hnom{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:4px;padding-right:30px}
.hsub{font-size:13.5px;color:#BCD4D8}
.hop{margin-top:12px;padding:9px 12px;background:rgba(255,255,255,.1);border-radius:8px;font-size:13.5px}
.hact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hact .btn{text-decoration:none}
.opc{border:1px solid var(--trait);border-left:3px solid var(--bleu);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.opg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.opg div{background:var(--fond);border-radius:6px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column}
.datebox{display:flex;align-items:center;gap:12px}
.datebox input[type=date]{width:auto;min-width:170px;padding:9px 12px;border-radius:10px;border:1px solid var(--trait);background:var(--fond);font-weight:500;color:var(--encre);-webkit-appearance:none;appearance:none}
.datebox input[type=date]::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}
.zone{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;vertical-align:1px;letter-spacing:.02em}
.zone.H1{background:#2C6FB5} .zone.H2{background:#E08A2E} .zone.H3{background:#C8422B} .zone.DOM{background:var(--vert)}
table.mini{width:100%;border-collapse:collapse;font-size:13px} table.mini th{text-align:left;font-weight:600;color:var(--encre-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--trait)} table.mini td{padding:7px 8px;border-bottom:1px solid #F1F4F4}
.gsync{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;margin-right:6px} .gsync.ok{color:var(--vert);background:var(--vert-pale)} .gsync.sync{color:var(--bleu);background:#E8F3F5} .gsync.err{color:var(--rouge);background:#FBE9E6}
/* panneau */
.ovl{position:fixed;inset:0;background:rgba(16,42,46,.42);z-index:80;display:flex;justify-content:flex-end;animation:ovin .25s ease}
.ovl.closing{animation:ovout .2s ease forwards}
@keyframes ovin{from{background:rgba(16,42,46,0)}} @keyframes ovout{to{background:rgba(16,42,46,0)}}
.pane{background:var(--carte);width:min(620px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-8px 0 30px rgba(16,42,46,.15);
  animation:slide .3s cubic-bezier(.2,.8,.2,1);overflow-wrap:anywhere}
.ovl.closing .pane{animation:slideout .2s ease forwards}
@keyframes slide{from{transform:translateX(40px);opacity:0}} @keyframes slideout{to{transform:translateX(30px);opacity:0}}
.pane header{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.x{background:none;border:0;cursor:pointer;color:var(--encre-3);font-size:20px;line-height:1;padding:0 4px}
.sec{padding:14px 0;border-top:1px solid var(--trait)}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sech h3{font-size:12.5px;color:var(--encre-3);font-weight:600}
.sech .btn{margin-left:auto}
.kv{display:grid;grid-template-columns:minmax(110px,140px) 1fr;gap:7px 12px;font-size:14px}
.kv dt{color:var(--encre-3)} .kv dd{margin:0;min-width:0}
.pane a{color:var(--bleu);text-decoration:none}
.note{background:var(--fond);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13.5px;white-space:pre-wrap}
.hist{padding:6px 0;border-bottom:1px solid #F1F4F4}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--trait);position:sticky;bottom:0;background:var(--carte);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--encre);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:13.5px;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* menu latéral */
.dovl{position:fixed;inset:0;background:rgba(16,42,46,.42);z-index:90;animation:ovin .25s ease}
.dovl.closing{animation:ovout .2s ease forwards}
.dpane{width:min(320px,86%);height:100%;background:var(--carte);box-shadow:8px 0 30px rgba(16,42,46,.18);padding:20px 16px;
  display:flex;flex-direction:column;overflow:auto;animation:dslide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dslide{from{transform:translateX(-30px);opacity:.4}}
.dlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:9px;
  cursor:pointer;font-size:14.5px;color:var(--encre);transition:background .15s}
.dlink:hover{background:var(--bleu-pale)}
.dlink.on{background:var(--encre);color:#fff;font-weight:600}
.dsep{height:1px;background:var(--trait);margin:12px 0}
.dfoot{margin-top:auto;font-size:12px;color:var(--encre-3);line-height:1.5;padding:12px}
.page h2{margin:22px 0 8px} .page p,.page ul{font-size:14.5px;color:var(--encre-2);max-width:62ch}

/* enrichissement */
.qrow{border:1px solid var(--trait);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff}
.cand{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin-top:6px;cursor:pointer}
.cand:hover{border-color:var(--bleu);background:var(--bleu-pale)}
.cand b{font-size:13.5px}
.cand .xs{color:var(--encre-3)}

/* assistant */
.abtn{position:fixed;right:18px;bottom:18px;z-index:45;width:54px;height:54px;border-radius:50%;background:var(--encre);color:#fff;border:0;
  cursor:pointer;box-shadow:0 8px 24px rgba(16,42,46,.28);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.abtn:hover{transform:scale(1.06)} .abtn:active{transform:scale(.95)}
.abtn svg{width:24px;height:24px}
.aovl{position:fixed;inset:0;background:rgba(16,42,46,.42);z-index:95;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 18px 18px;animation:ovin .25s}
.aovl.closing{animation:ovout .18s forwards}
.apane{width:min(420px,100%);height:min(620px,82vh);background:var(--carte);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(16,42,46,.3);animation:apop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes apop{from{transform:translateY(20px) scale(.97);opacity:0}}
.ahead{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--trait)}
.abody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.avide{color:var(--encre-3);font-size:13.5px;text-align:center;margin:auto;line-height:1.7}
.amsg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5}
.amsg.u{align-self:flex-end;background:var(--encre);color:#fff;border-bottom-right-radius:4px}
.amsg.a{align-self:flex-start;background:var(--fond);border:1px solid var(--trait);border-bottom-left-radius:4px}
.ares{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ait{background:#fff;border:1px solid var(--trait);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column}
.ait:hover{border-color:var(--bleu)}
.ait b{font-size:13px} .ait span{font-size:11.5px;color:var(--encre-3)}
.asugg{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-top:1px solid var(--trait)}
.asugg .chip{white-space:nowrap}
.ain{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--trait)}
.ain input{flex:1}

@media(max-width:820px){
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{min-height:100px;padding:14px;border-radius:14px} .tile .v{font-size:25px}
}
@media(max-width:700px){
  .topin{padding:10px 12px;flex-wrap:wrap}
  #bNew{order:4;width:100%;margin-top:8px}
  .tabs{order:3;width:100%;margin:6px 0 0;overflow-x:auto}
  .wrap{padding:14px 12px}
  .cols{grid-template-columns:1fr}
  .pane{padding:16px;width:100%}
  input,select,textarea{font-size:16px!important}
  .abtn{right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:48px;height:48px}
  .aovl{padding:0} .apane{height:88vh;width:100%;border-radius:16px 16px 0 0}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.gbox{opacity:1;transform:none}}
/* visite guidée */
.tour{position:fixed;z-index:300;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(460px,calc(100% - 24px));background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:16px 18px;box-shadow:0 16px 44px rgba(13,27,51,.28);animation:tin .25s ease}
.tour .tstep{font-size:12px;color:var(--bleu);font-weight:600;margin-bottom:4px}
.tour h3{margin-bottom:6px;font-size:16px}
.tour p{font-size:14px;color:var(--encre-2);margin:0 0 12px;line-height:1.45}
.tour .tbtns{display:flex;gap:8px;align-items:center}
.tour-hi{outline:3px solid var(--bleu)!important;outline-offset:4px;border-radius:10px;box-shadow:0 0 0 8px rgba(31,94,232,.16)!important}
/* ---------- script d'éligibilité dans la fiche ---------- */
.sbox{border:1px solid #C5D3F6;background:var(--bleu-pale);border-radius:12px;padding:12px 14px;margin:10px 0 12px}
.sbox .st{font-size:12px;font-weight:700;color:var(--bleu-fonce);text-transform:uppercase;letter-spacing:.05em}
.sbox .sf{font-size:14px;font-weight:600;margin:3px 0 8px}
.sbox .btn.w{font-size:15px;padding:11px 14px}
.sbox .btn.w.pulse{animation:spulse 1.4s ease-in-out infinite}
@keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(31,94,232,.45)}50%{box-shadow:0 0 0 8px rgba(31,94,232,0)}}
.sres{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--trait)}
.sres b.v{color:var(--vert)} .sres b.r{color:var(--rouge)} .sres b.a{color:var(--ambre)}
.tour-hi-rap{animation:spulse 1.2s ease-in-out 3;border-radius:10px}
/* ---------- information CEE ---------- */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.ecard{text-align:left;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;font-family:inherit;color:inherit}
.ecard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(13,27,51,.09);border-color:#C5CEE8}
.ecode{font-weight:700;font-size:13px;color:var(--bleu-fonce);letter-spacing:.02em}
.etit{font-size:14px;font-weight:600;margin-top:4px;line-height:1.3}
#elig .ovl{z-index:85}

function nafInfo(code){
  if(!code) return {lib:'',sect:''};
  const c=String(code).replace(/\s/g,'').toUpperCase();
  const div=c.slice(0,2), fin=c.slice(0,5);
  const d=NAF_DIV[div]||['',''];
  return {lib:(NAF_FIN[fin]||d[0]||''),sect:d[1]||''};
}

const Store=(()=>{
  const ws=typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';
  let dbp=null;
  const idb=()=>{if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('dombase',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});return dbp;};
  const hasIDB=typeof indexedDB!=='undefined';
  async function iget(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result===undefined?null:t.result);t.onerror=()=>rej(t.error);});}
  async function iset(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'));});}
  async function idel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
  let mode=ws?'artifact':hasIDB?'idb':'local';
  return{
    mode:()=>mode,
    async get(k){
      if(mode==='artifact'){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}
      if(mode==='idb'){try{const v=await iget(k);if(v!==null)return v;}catch(e){mode='local';}}
      try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}
    },
    async set(k,v){
      if(mode==='artifact'){await window.storage.set(k,JSON.stringify(v));return;}
      if(mode==='idb'){try{await iset(k,v);try{localStorage.removeItem(k);}catch(e){}return;}catch(e){mode='local';}}
      try{localStorage.setItem(k,JSON.stringify(v));}catch(e){throw new Error('stockage plein');}
    },
    async del(k){
      if(mode==='artifact'){try{await window.storage.delete(k);}catch(e){}return;}
      if(mode==='idb'){try{await idel(k);}catch(e){}}
      try{localStorage.removeItem(k);}catch(e){}
    }
  };
})();

  if(dt&&!(f.dept||'').startsWith('97')){f.dept=dt;if(!cp.startsWith('97'))f.cp='';}

function recalc(f){

async function load(){
  let meta=null;try{meta=await Store.get(K+':meta');}catch(e){}
  let anc=[];
  if(meta&&meta.n){for(let i=0;i<meta.n;i++){const part=await Store.get(K+':'+i);if(Array.isArray(part))anc.push(...part);}}
  anc=anc.map(f=>Object.assign({statut:'Non traité',suivi:[],ops:[],naf:'',naf_lib:'',enrichi:'',email:'',secteur:'',secteur_src:'',fiche_origine:'',type_lead:''},f));
  if(anc.length&&meta.version===DATA_VERSION){fiches=anc;}
  else{
    // nouvelle version des données : on repart de DATA et on réapplique ce que l'utilisateur a acquis
    fiches=depuisDATA();
    if(anc.length){
      const idx=new Map();anc.forEach(f=>{[cleFiche(f),...clesDoublon(f)].forEach(k=>{if(!idx.has(k))idx.set(k,f);});});
      let rep=0;const pris=new Set();
      fiches.forEach(f=>{let a=null;for(const k of [cleFiche(f),...clesDoublon(f)]){if(idx.has(k)){a=idx.get(k);break;}}if(!a)return;pris.add(a);
        ['naf','naf_lib','dirigeant','siege','enrichi','enrichi_par','statut','rappel','email','fiche_visee'].forEach(k=>{if(a[k]&&!f[k])f[k]=a[k];});
        if(a.naf){f.naf=a.naf;f.naf_lib=a.naf_lib;f.secteur=a.secteur||f.secteur;f.secteur_src=a.secteur_src||f.secteur_src;}
        if(a.statut&&a.statut!=='Non traité')f.statut=a.statut;
        if(a.suivi&&a.suivi.length)f.suivi=a.suivi;
        (a.ops||[]).filter(o=>o.source==='Saisie manuelle').forEach(o=>{f.ops.push(o);});
        if(a.enrich_etat)f.enrich_etat=a.enrich_etat;
        if(a.autres&&a.autres.length)f.autres=a.autres;
        rep++;});
      // fiches créées à la main dans l'ancienne version
      anc.filter(f=>!pris.has(f)&&(f.source==='Saisie manuelle'||(f.source||'').startsWith('Import'))).forEach(f=>fiches.push(f));
      fiches.forEach(recalc);
      const nd=dedoublonner();
      console.log('Migration : '+rep+' fiches réconciliées, '+nd+' doublons fusionnés');
    }
    await chargerFile();
    baseline();
    await save();
    return;
  }
  baseline();
  await chargerFile();
}

async function save(){

    if(fType&&(f.type_lead||'')!==fType)return false;

      if(!ql.split(' ').every(w=>hay.includes(w)))return false;}
    return true;
  });
}

const API='https://recherche-entreprises.api.gouv.fr/search';
async function apiSearch(params){
  const u=API+'?'+new URLSearchParams(params).toString();
  const r=await fetch(u);
  if(r.status===429){await new Promise(x=>setTimeout(x,1500));return apiSearch(params);}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function lierSociete(f,c){
  f.autres=f.autres||[];if(f.autres.some(x=>x.siren===c.siren))return;
  const i=nafInfo(c.activite_principale);
  f.autres.push({siren:c.siren,nom:c.nom_complet||'',naf:c.activite_principale||'',naf_lib:i.lib,secteur:i.sect,adresse:c.siege&&c.siege.adresse||''});
}
function appliquerEntreprise(f,e){
  f.enrichi_par=user&&user.nom||'';
  const et=(e.matching_etablissements||[]).find(x=>x.code_postal===f.cp)||e.siege||{};
  f.siren=e.siren||f.siren;
  f.siret=et.siret||f.siret;
  f.naf=e.activite_principale||et.activite_principale||'';
  const info=nafInfo(f.naf);
  f.naf_lib=info.lib;f.secteur=info.sect||f.secteur;f.secteur_src='Code NAF officiel';
  if(!f.raison_sociale)f.raison_sociale=e.nom_complet||'';
  if(!f.adresse&&et.adresse)f.adresse=et.adresse;
  if(!f.cp&&et.code_postal)f.cp=et.code_postal;
  if(!f.ville&&et.libelle_commune)f.ville=et.libelle_commune;
  f.siege=(e.siege&&e.siege.adresse)||'';
  const d=(e.dirigeants||[])[0];
  f.dirigeant=d?[d.prenoms,d.nom].filter(Boolean).join(' ')+(d.qualite?' ('+d.qualite+')':''):'';
  f.enrichi=AUJ();
}
/* ---- matching multi-critères ---- */
function tokens(s){return norm(s).split(' ').filter(w=>w.length>2&&!['sarl','sas','sasu','eurl','sci','societe','ste','ets','eirl','snc','scea','earl','gaec','selarl','the','les','des','and'].includes(w));}
function scorer(f,c){
  const raisons=[];let s=0;
  const cn=norm(c.nom_complet||''), cr=norm(c.nom_raison_sociale||c.nom_complet||''), fr=norm(f.raison_sociale||'');
  if(fr){
    if(cr===fr||cn===fr){s+=40;raisons.push('Nom exact');}
    else if(cr.startsWith(fr)||cn.includes(fr)){s+=30;raisons.push('Nom ≈');}
    else{const tf=tokens(f.raison_sociale),tc=tokens(c.nom_complet);const inter=tf.filter(t=>tc.some(x=>x===t||x.startsWith(t)||t.startsWith(x))).length;
      if(tf.length&&inter){const r=inter/tf.length;s+=Math.round(25*r);if(r>=.5)raisons.push('Nom partiel');}}
  }
  const dn=norm(f.nom), dp=norm(f.prenom);
  const dirs=c.dirigeants||[];
  if(dn&&dirs.some(d=>norm(d.nom)===dn||(d.nom&&norm(d.nom).includes(dn)))){s+=30;raisons.push('Dirigeant : '+dirs.find(d=>norm(d.nom).includes(dn)).nom);
    if(dp&&dirs.some(d=>norm(d.prenoms||'').includes(dp.split(' ')[0]))){s+=12;raisons.push('Prénom ✓');}}
  else if(dn&&(cn.includes(dn)||cr.includes(dn))){s+=18;raisons.push('Nom dans la raison sociale');}
  const etabs=[c.siege,...(c.matching_etablissements||[])].filter(Boolean);
  if(f.cp&&etabs.some(e=>e.code_postal===f.cp)){s+=20;raisons.push('Code postal ✓');}
  else if(f.ville&&etabs.some(e=>norm(e.libelle_commune||'')===norm(f.ville))){s+=15;raisons.push('Commune ✓');}
  else if(f.dept&&etabs.some(e=>(e.departement||'')===f.dept||(e.code_postal||'').startsWith(f.dept.slice(0,2))&&f.dept.startsWith('97')&&(e.code_postal||'').startsWith(f.dept))){s+=8;raisons.push('Département ✓');}
  if(c.etat_administratif==='A')s+=5;else{s-=15;raisons.push('Cessée');}
  return{s,raisons};
}
async function chercher(f){
  const id=(f.siret||f.siren||'').replace(/\D/g,'');
  if(id.length===14||id.length===9){
    const j=await apiSearch({q:id,page:1,per_page:1});
    if(j.results&&j.results.length)return{auto:j.results[0],cands:[]};
  }
  const nom=(f.raison_sociale||'').trim(), pers=[f.prenom,f.nom].filter(Boolean).join(' ').trim();
  const requetes=[];
  if(nom.length>2){requetes.push({q:nom,departement:f.dept});requetes.push({q:nom});}
  if(pers.length>3){requetes.push({q:pers,departement:f.dept});if(f.nom&&f.nom.length>3)requetes.push({q:f.nom,departement:f.dept});}
  if(!requetes.length)return{auto:null,cands:[]};
  const vus=new Map();
  for(const p of requetes){
    if(p.departement===undefined||p.departement===''){delete p.departement;}
    const j=await apiSearch(Object.assign({page:1,per_page:8},p));
    (j.results||[]).forEach(c=>{if(!vus.has(c.siren))vus.set(c.siren,c);});
    if(vus.size>=12)break;
    await new Promise(x=>setTimeout(x,120));
  }
  if(!vus.size)return{auto:null,cands:[]};
  const notes=[...vus.values()].map(c=>{const r=scorer(f,c);c._score=r.s;c._raisons=r.raisons;return c;}).sort((a,b)=>b._score-a._score);
  const best=notes[0], second=notes[1];
  if(best._score>=55&&(!second||best._score-second._score>=20))return{auto:best,cands:[]};
  return{auto:null,cands:notes.filter(c=>c._score>=15).slice(0,6)};
}

/* ---------- dédoublonnage ---------- */
function clesDoublon(f){
  const k=[];
  if(f.siret)k.push('s:'+f.siret);
  if(f.siren)k.push('r:'+f.siren);
  const t=(f.tel||'').replace(/\D/g,'');if(t.length>=9)k.push('t:'+t);
  if(f.email&&!f.siret)k.push('m:'+f.email.toLowerCase());
  if(f.raison_sociale&&norm(f.raison_sociale).length>3)k.push('o:'+norm(f.raison_sociale)+'|'+(f.cp||f.territoire||''));
  if(f.nom&&f.prenom)k.push('n:'+norm(f.nom+' '+f.prenom)+'|'+(f.cp||''));
  else if(f.nom&&!f.raison_sociale&&norm(f.nom).length>3)k.push('n1:'+norm(f.nom)+'|'+(f.cp||f.ville||f.territoire||''));
  return k;
}
function fusionner(a,b){
  ['raison_sociale','siret','siren','naf','naf_lib','tel','tel2','email','adresse','cp','ville','dept','territoire','fonction','secteur','secteur_src','dirigeant','siege','enrichi','rappel','fiche_visee','effectif','site','forme','annee'].forEach(k=>{if(!a[k]&&b[k])a[k]=b[k];});
  if(b.contacts&&b.contacts.length&&!(a.contacts&&a.contacts.length))a.contacts=b.contacts;
  if(b.naf&&!a.naf){a.naf=b.naf;a.naf_lib=b.naf_lib;a.secteur=b.secteur;a.secteur_src=b.secteur_src;}
  if((!a.statut||a.statut==='Non traité')&&b.statut)a.statut=b.statut;
  a.suivi=[...(a.suivi||[]),...(b.suivi||[])];
  (b.ops||[]).forEach(o=>{const same=(a.ops||[]).find(x=>x.fiche===o.fiche&&(x.source===o.source||(x.date===o.date&&x.quantite===o.quantite)));if(!same)a.ops.push(o);});
  (b.autres||[]).forEach(x=>{a.autres=a.autres||[];if(!a.autres.some(y=>y.siren===x.siren))a.autres.push(x);});
  if(b.source&&!(a.source||'').includes(b.source))a.source=(a.source?a.source+' + ':'')+b.source;
  recalc(a);
}
function dedoublonner(){
  const idx=new Map();const garde=[];let n=0;
  fiches.forEach(f=>{
    let c=null;for(const k of clesDoublon(f)){if(idx.has(k)){const x=idx.get(k);if(x.siret&&f.siret&&x.siret!==f.siret)continue;c=x;break;}}
    if(c){fusionner(c,f);n++;clesDoublon(c).forEach(k=>{if(!idx.has(k))idx.set(k,c);});}
    else{garde.push(f);clesDoublon(f).forEach(k=>{if(!idx.has(k))idx.set(k,f);});}
  });
  fiches=garde;return n;
}

const IMP_FIELDS=[['raison_sociale','Société'],['nom','Nom'],['prenom','Prénom'],['siret','SIRET'],['siren','SIREN'],['naf','Code NAF'],['tel','Téléphone'],['email','E-mail'],['adresse','Adresse'],['cp','Code postal'],['ville','Ville'],['fonction','Fonction'],['luminaires','Luminaires / quantité'],['surface','Surface (m²)'],['date_op','Date d\'installation'],['poseur','Électricien / poseur'],['secteur','Secteur d\'activité'],['fiche_origine','Fiche CEE installée']];
const IMP_RULES={surface:['m2','m²','surface','superficie'],date_op:['date'],poseur:['poseur','elec','électricien','electricien','technicien'],raison_sociale:['societe','société','raison','entreprise','nom de l','company','enseigne'],nom:['nom','last'],prenom:['prenom','prénom','first'],siret:['siret'],siren:['siren'],naf:['naf','ape'],tel:['tel','tél','phone','portable','mobile','numero','numéro'],email:['mail','courriel'],adresse:['adresse','rue','voie'],cp:['cp','postal','zip','dep'],ville:['ville','commune'],fonction:['fonction','poste','qualite','qualité'],luminaires:['luminaire','quantite','quantité','nombre','nb'],secteur:['secteur','activite','activité'],fiche_origine:['fiche','operation','opération','cee']};
let parsed=null;
function guessMap(h){const map={};h.forEach(c=>{const l=norm(c);for(const [f,keys] of Object.entries(IMP_RULES)){if(map[f])continue;if(keys.some(k=>l===norm(k)||l.includes(norm(k)))){map[f]=c;break;}}});
  if(map.nom&&map.raison_sociale===map.nom)delete map.nom;return map;}
function showImport(){
  const z=document.getElementById('impzone');
  z.innerHTML=`<hr class="hr"><div class="card" style="border-style:dashed;text-align:center;cursor:pointer;color:var(--encre-3)" id="idrop">Déposer un fichier Excel ou CSV<br><span class="xs">première ligne = intitulés de colonnes · touchez pour choisir</span></div><input type="file" id="ifile" accept=".xlsx,.xls,.csv" style="display:none"><div id="imap"></div>`;
  const d=document.getElementById('idrop');d.onclick=()=>document.getElementById('ifile').click();
  document.getElementById('ifile').onchange=e=>{if(e.target.files[0])parseFile(e.target.files[0]);};
  d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])parseFile(e.dataTransfer.files[0]);};
}
function parseFile(file){const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  const feuilles=wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:false})})).filter(x=>x.rows.length);
  if(!feuilles.length){toast('Fichier vide');return;}parsed={feuilles,i:0,name:file.name};drawMap();}catch(err){toast('Lecture impossible');}};r.readAsArrayBuffer(file);}
function drawMap(){
  const z=document.getElementById('imap'),fe=parsed.feuilles[parsed.i];const headers=Object.keys(fe.rows[0]);parsed.map=guessMap(headers);
  z.innerHTML=`<div class="sm" style="margin:12px 0 6px"><b>${esc(parsed.name)}</b>${parsed.feuilles.length>1?` — feuille <select id="isheet" style="width:auto;padding:4px 8px">${parsed.feuilles.map((f,i)=>`<option value="${i}" ${i===parsed.i?'selected':''}>${esc(f.n)} (${f.rows.length})</option>`).join('')}</select>`:''} — ${fe.rows.length} lignes. Vérifiez la correspondance des colonnes.</div>
    ${IMP_FIELDS.map(([k,l])=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #F1F4F4"><span class="sm">${l}</span><select data-m="${k}"><option value="">— ignorer —</option>${headers.map(h=>`<option ${parsed.map[k]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px">
      <div style="flex:1;min-width:200px"><label class="f">Fiche CEE installée par défaut</label><select id="idfiche"><option value="">— aucune —</option>${optFiches('',40)}</select></div>
      <div style="min-width:160px"><label class="f">Statut</label><select id="idtype"><option value="Client installé">Installé</option><option value="Prospect">Prospect</option><option value="Fichier acheté">Non installé</option></select></div>
      <div style="min-width:160px"><label class="f">Nom de la source</label><input type="text" id="idsrc" value="${esc(fe.n)}"></div>
      <button class="btn" id="irun">Importer ${fe.rows.length} lignes</button></div>`;
  const sh=document.getElementById('isheet');if(sh)sh.onchange=e=>{parsed.i=+e.target.value;drawMap();};
  z.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>parsed.map[s.dataset.m]=s.value);
  document.getElementById('irun').onclick=runImport;
}
function telN(v){let d=String(v||'').replace(/\D/g,'');d=d.replace(/^0033/,'33');if(d.startsWith('33')&&d.length>=11)d='0'+d.slice(2);
  for(const ind of ['590','596','594','262','269']){if(d.startsWith(ind)&&d.length>10){const r=d.slice(3);if(r.length===9&&r[0]==='6'){d='0'+r;break;}if(r.length===10&&r[0]==='0'){d=r;break;}}}
  if(d.length===9&&'567'.includes(d[0]))d='0'+d;if(d.length!==10)return String(v||'').trim();return d.replace(/(\d{2})(?=\d)/g,'$1 ');}
async function runImport(){
  const fe=parsed.feuilles[parsed.i], defF=document.getElementById('idfiche').value, typ=document.getElementById('idtype').value, src=document.getElementById('idsrc').value.trim()||fe.n;
  const seen=new Set(fiches.flatMap(x=>[x.siret&&x.siret.replace(/\D/g,''),x.siren&&x.siren.replace(/\D/g,''),x.tel&&x.tel.replace(/\D/g,''),x.raison_sociale&&('soc:'+norm(x.raison_sociale)+'|'+x.cp),x.nom&&('nom:'+norm(x.nom+' '+x.prenom)+'|'+x.cp)].filter(Boolean)));
  let n=0,dup=0,skip=0;
  fe.rows.forEach(row=>{
    const o={id:uid(),statut:'Non traité',suivi:[],naf:'',naf_lib:'',enrichi:'',email:'',secteur:'',secteur_src:'',source:src,dept:'',territoire:'',ops:[]};
    IMP_FIELDS.forEach(([k])=>{const c=parsed.map[k];o[k]=c?String(row[c]==null?'':row[c]).trim():'';});
    if(!o.nom&&!o.raison_sociale&&!o.tel&&!o.siret){skip++;return;}
    o.tel=telN(o.tel);o.siret=o.siret.replace(/\D/g,'').replace(/^(\d{14}).*$/,'$1');o.siren=(o.siren||o.siret).replace(/\D/g,'').slice(0,9);
    if(o.cp&&o.cp.replace(/\D/g,'').length>5)o.cp=o.cp.replace(/\D/g,'').slice(0,5);
    geo(o);
    if(o.naf){const i=nafInfo(o.naf);if(i.sect){o.secteur=o.secteur||i.sect;o.naf_lib=i.lib;o.secteur_src='Code NAF';}}
    if(o.secteur&&!o.secteur_src)o.secteur_src='Fichier importé';
    if(o.fiche_origine){const c=o.fiche_origine.toUpperCase().replace(/\s/g,'');const hit=FICHES_TOUTES.find(f=>c.includes(f[0]));o.fiche_origine=hit?hit[0]:defF;}
    const fc=o.fiche_origine||defF;
    if(fc||o.luminaires)o.ops.push({fiche:fc,statut:typ==='Client installé'?'Installé':typ==='Prospect'?'Prospect':'Non installé',quantite:o.luminaires||'',unite:'luminaires',surface:o.surface||'',hauteur:'',date:o.date_op||'',poseur:o.poseur||'',commentaire:'',source:src});
    recalc(o);if(!o.ops.length)o.type_lead=typ==='Client installé'?'Installé':typ==='Prospect'?'Prospect':'Non installé';
    const ks=[o.siret,o.siren,o.tel.replace(/\D/g,'')].filter(x=>x&&x.length>=9);if(o.raison_sociale)ks.push('soc:'+norm(o.raison_sociale)+'|'+o.cp);if(o.nom)ks.push('nom:'+norm(o.nom+' '+o.prenom)+'|'+o.cp);
    if(ks.some(k=>seen.has(k))){dup++;return;}ks.forEach(k=>seen.add(k));
    fiches.push(o);n++;
  });
  await save();parsed=null;render();toast(n+' fiches importées'+(dup?' · '+dup+' doublons écartés':'')+(skip?' · '+skip+' lignes vides':''));
}

  XLSX.writeFile(wb,nom||'dombase.xlsx');
}

const ficheLigne=(x,n)=>x[0]+' — '+esc(x[1]).slice(0,n||40);
function optFiches(sel,n){
  const T=FICHES_TRAVAIL.map(c=>FICHES_TOUTES.find(x=>x[0]===c)).filter(Boolean);
  const A=FICHES_TOUTES.filter(x=>!FICHES_TRAVAIL.includes(x[0])).slice().sort((a,b)=>a[0].localeCompare(b[0]));
  const o=x=>`<option value="${x[0]}" ${sel===x[0]?'selected':''}>${ficheLigne(x,n)}</option>`;
  return `<optgroup label="Fiches à travailler">${T.map(o).join('')}</optgroup><optgroup label="Toutes les fiches">${A.map(o).join('')}</optgroup>`;
}

const ELIG_MAP=Object.fromEntries(ELIG.map(e=>[e.code,e]));
const eligQuestions=e=>[...ELIG_COMMUN,...e.q];

function vInfoCee(){
  const DOMF=['BAR-EN-106','BAR-EN-107','BAR-TH-124'];const grp=[['Résidentiel outre-mer','DOM'],['Résidentiel métropole','BAR'],['Industrie','IND'],['Agriculture','AGR'],['Transport','TRA'],['Réseaux et éclairage','RES']];
  return `<div class="page"><h1>Information CEE</h1>
  <p>Les questions à poser au téléphone pour savoir, en deux minutes, si un prospect peut prétendre à une fiche. Aucun montant, aucun calcul : seulement ce qui rend éligible, ou non. Touchez une fiche, cochez les réponses, le verdict s'affiche et peut être collé dans la note d'appel. Les fiches résidentielles métropole sont là pour les quelques prospects hors DOM ; leurs équivalents outre-mer sont en tête.</p>
  <div class="xs mut" style="margin-bottom:6px">Les fiches marquées « provisoire » seront recalées sur les fiches officielles dès réception.</div>
  ${grp.map(([lbl,pre])=>{const L=ELIG.filter(e=>pre==='DOM'?DOMF.includes(e.code):(e.code.startsWith(pre)&&!DOMF.includes(e.code)));return L.length?`<h2>${lbl}</h2><div class="egrid">${L.map(e=>`<button class="ecard" data-elig="${e.code}"><div class="ecode">${e.code}${e.prov?'<span class="tag a" style="margin-left:8px;font-size:10.5px">provisoire</span>':''}</div><div class="etit">${esc(ficheTitre(e.code))}</div><div class="xs mut" style="margin-top:6px">${esc(e.secteur)}</div><div class="xs" style="margin-top:8px;color:var(--bleu);font-weight:600">${eligQuestions(e).length} questions ›</div></button>`).join('')}</div>`:'';}).join('')}
  <h2>Rappel pour toutes les fiches</h2>
  <ul><li>Rien de signé, rien de commencé : c'est la question numéro un.</li><li>L'interlocuteur doit pouvoir décider ou obtenir l'accord du propriétaire.</li><li>Le verdict de la checklist est une pré-qualification : la visite technique confirme.</li></ul></div>`;
}

/* checklist interactive : overlay au-dessus de la fiche client */
let eligEtat={};
function openElig(code,ficheId){
  const e=ELIG_MAP[code];if(!e)return;
  const Q=eligQuestions(e);
  let st=eligEtat[code+':'+(ficheId||'')];
  if(!st){const fx=ficheId?fiches.find(x=>x.id===ficheId):null;st=eligEtat[code+':'+(ficheId||'')]=(fx&&fx.elig&&fx.elig.code===code&&fx.elig.r)?{r:Object.assign({},fx.elig.r),d:Object.assign({},fx.elig.dd||{})}:{r:{},d:{}};}
  let c=document.getElementById('elig');if(!c){c=document.createElement('div');c.id='elig';document.body.appendChild(c);}
  const f=ficheId?fiches.find(x=>x.id===ficheId):null;
  c.innerHTML=`<div class="ovl eovl" id="eovl"><div class="pane" onclick="event.stopPropagation()">
    <header><div style="flex:1;min-width:0"><div class="chips" style="margin-bottom:6px"><span class="tag b">${e.code}</span><span class="tag">${eligSecteur(e)}</span>${e.prov?'<span class="tag a">provisoire</span>':''}</div><h2>${esc(ficheTitre(e.code))}</h2>${f?`<div class="sm mut" style="margin-top:4px">Pour ${esc(nomClient(f))}</div>`:''}</div><button class="btn g sm" id="ecx">Fermer</button></header>
    <p class="sm" style="color:var(--encre-2)">${esc(e.intro)}</p>
    <div id="everdict" class="everdict"></div>
    <section class="sec"><div class="sech"><h3>Questions d'éligibilité</h3><span class="xs mut">réponse attendue : <b>oui</b></span></div>
      ${Q.map((q,i)=>`<div class="eq" data-i="${i}"><div class="eqt">${i+1}. ${esc(q.t)}</div><div class="chips" style="margin-top:6px"><span class="chip ${st.r[i]==='oui'?'on':''}" data-rep="oui">Oui</span><span class="chip ${st.r[i]==='non'?'on':''}" data-rep="non">Non</span><span class="chip ${st.r[i]==='?'?'on':''}" data-rep="?">Ne sait pas</span></div><div class="xs mut eqa" style="margin-top:5px">${esc(q.aide)}</div></div>`).join('')}
    </section>
    ${e.att&&e.att.length?`<section class="sec"><div class="sech"><h3>Points de vigilance</h3></div>${e.att.map(a=>`<div class="eatt">${esc(a)}</div>`).join('')}</section>`:''}
    <section class="sec"><div class="sech"><h3>À noter pendant l'appel</h3></div>
      ${e.d.map((d,i)=>`<div class="ed"><label class="f">${esc(d)}</label><input type="text" data-d="${i}" value="${esc(st.d[i]||'')}" placeholder="…"></div>`).join('')}
    </section>
    <div class="actions"><button class="btn" id="ecopy">${f?'Enregistrer le questionnaire':'Copier le résumé'}</button><button class="btn g" id="ereset">Effacer</button><button class="btn g" id="ecx2" style="margin-left:auto">Fermer</button></div>
  </div></div>`;
  const verdict=()=>{
    const bl=Q.map((q,i)=>st.r[i]);
    const ko=Q.filter((q,i)=>st.r[i]&&st.r[i]!=='?'&&st.r[i]!==q.ok);
    const manq=Q.filter((q,i)=>!st.r[i]||st.r[i]==='?').length;
    const v=document.getElementById('everdict');
    let cls,txt,sub;
    if(ko.length){cls='r';txt='Non éligible en l\'état';sub='Point bloquant : '+ko.map(q=>q.t.replace(/\s*\?$/,'')).slice(0,2).join(' · ');}
    else if(manq){cls='a';txt='Qualification en cours';sub=manq+' question'+(manq>1?'s':'')+' sans réponse';}
    else{cls='v';txt='Éligible sur le papier';sub='À confirmer par la visite technique';}
    v.className='everdict '+cls;v.innerHTML=`<b>${txt}</b><span>${sub}</span>`;
    return {cls,txt,ko,manq};
  };
  const resume=()=>{
    const r=verdict();
    const oui=Q.filter((q,i)=>st.r[i]===q.ok).length;
    const notes=e.d.map((d,i)=>st.d[i]?d.replace(/\s*\(.*\)/,'')+' : '+st.d[i]:'').filter(Boolean);
    return `Éligibilité ${e.code} — ${r.txt} (${oui}/${Q.length} ok${r.manq?', '+r.manq+' sans réponse':''})`+(r.ko.length?'. Bloquant : '+r.ko.map(q=>q.t.replace(/\s*\?$/,'')).join(' ; '):'')+(notes.length?'. '+notes.join(' · '):'');
  };
  c.querySelectorAll('.eq').forEach(el=>el.querySelectorAll('[data-rep]').forEach(ch=>ch.onclick=()=>{const i=+el.dataset.i;st.r[i]=st.r[i]===ch.dataset.rep?undefined:ch.dataset.rep;el.querySelectorAll('[data-rep]').forEach(x=>x.classList.toggle('on',x.dataset.rep===st.r[i]));el.classList.toggle('ko',!!st.r[i]&&st.r[i]!=='?'&&st.r[i]!==Q[i].ok);el.classList.toggle('ok',st.r[i]===Q[i].ok);verdict();}));
  c.querySelectorAll('.eq').forEach(el=>{const i=+el.dataset.i;el.classList.toggle('ko',!!st.r[i]&&st.r[i]!=='?'&&st.r[i]!==Q[i].ok);el.classList.toggle('ok',st.r[i]===Q[i].ok);});
  c.querySelectorAll('[data-d]').forEach(inp=>inp.oninput=()=>{st.d[+inp.dataset.d]=inp.value;});
  document.getElementById('eovl').onclick=closeElig;
  document.getElementById('ecx').onclick=closeElig;document.getElementById('ecx2').onclick=closeElig;
  document.getElementById('ereset').onclick=()=>{eligEtat[code+':'+(ficheId||'')]=null;openElig(code,ficheId);};
  document.getElementById('ecopy').onclick=async()=>{
    const txt=resume();
    const dn=document.getElementById('dn'),dfv=document.getElementById('dfv');
    if(f){const r=verdict();const oui=Q.filter((q,i)=>st.r[i]===q.ok).length;const notes=e.d.map((d,i)=>st.d[i]?d.replace(/\s*\(.*\)/,'')+' : '+st.d[i]:'').filter(Boolean);
      f.elig={code:e.code,txt:r.txt,cls:r.cls,oui,total:Q.length,ko:r.ko.map(q=>q.t.replace(/\s*\?$/,'')),notes,r:Object.assign({},st.r),dd:Object.assign({},st.d),d:AUJ(),par:(user&&user.nom)||''};
      f.fiche_visee=f.fiche_visee||e.code;f.charge=f.charge||(user&&user.nom)||'';
      if(dn)dn.value=(dn.value?dn.value.trim()+'\n':'')+txt;if(dfv&&!dfv.value)dfv.value=e.code;
      const dst=document.getElementById('dst');if(dst&&r.cls==='v'&&(dst.value==='Non traité'||dst.value==='Rappelé'))dst.value='Intéressé';if(dst&&r.cls==='r'&&dst.value==='Non traité')dst.value='Refus';
      const sb=document.getElementById('sbres');if(sb)sb.innerHTML=eligResume(f);const bb=document.getElementById('delig');if(bb)bb.classList.remove('pulse');
      await save();closeElig();
      const dr=document.querySelector('[data-rap="3"]');if(dr){const box=dr.closest('.chips');if(box){box.classList.add('tour-hi-rap');setTimeout(()=>box.classList.remove('tour-hi-rap'),4000);try{box.scrollIntoView({block:'center',behavior:'smooth'});}catch(err){}}}
      toast(r.cls==='v'?'Questionnaire enregistré — planifiez le rendez-vous ou le rappel':'Questionnaire enregistré');return;}
    try{await navigator.clipboard.writeText(txt);toast('Résumé copié');}catch(err){prompt('Résumé à copier :',txt);}
  };
  verdict();
}
function closeElig(){const c=document.getElementById('elig');if(!c)return;const o=c.querySelector('.ovl');if(!o||o.classList.contains('closing'))return;o.classList.add('closing');setTimeout(()=>{if(c.querySelector('.ovl')===o)c.innerHTML='';},210);}

const KT='dombase:tour';
async function tourMasque(){try{if(localStorage.getItem(KT))return true;}catch(e){}try{return !!(await Store.get(KT));}catch(e){return false;}}
async function masquerTour(on){try{if(on)localStorage.setItem(KT,'1');else localStorage.removeItem(KT);}catch(e){}try{if(on)await Store.set(KT,1);else await Store.del(KT);}catch(e){}}
async function tourAuto(anim){if(await tourMasque())return;setTimeout(startTour,anim?900:500);}
const TOUR=[
 {v:'tableau',t:'Le tableau de bord',p:'Chaque tuile est un raccourci : touchez « Appels à passer », un territoire ou un secteur et la base s\'ouvre déjà filtrée. Les chiffres se mettent à jour à chaque appel enregistré.',sel:'.tiles'},
 {v:'base',t:'La base clients',p:'Recherche par nom, société, téléphone, e-mail, ville ou SIRET. Les filtres se combinent : territoire, secteur, statut, source, fiche installée… « Exporter » sort la liste affichée en Excel.',sel:'#view .card'},
 {v:'base',open:'fiche',t:'Requalifier un client',p:'Touchez une ligne : la fiche s\'ouvre. Dans « Suivi commercial », choisissez le résultat de l\'appel, la fiche CEE proposée, un prochain appel, une note, puis « Enregistrer l\'appel ». Le bouton « Questions d\'éligibilité » pose les bonnes questions pendant l\'appel.',sel:'#dst'},
 {v:'base',open:'nouveau',t:'Créer un client',p:'Bouton « Nouveau client » : le SIRET remplit tout seul la société, l\'adresse, le code NAF et le secteur. Ensuite prénom, nom, téléphone, e-mail.',sel:'#n_prenom'},
 {v:'infocee',t:'Information CEE',p:'Les questions à poser pour savoir si un prospect est éligible à une fiche : rien de chiffré, seulement ce qui qualifie ou disqualifie. Touchez une fiche, cochez les réponses, le verdict s\'affiche et se colle dans la note d\'appel.',sel:'.egrid'},
 {v:'tableau',open:'menu',t:'Le serveur d\'équipe',p:'Il est déjà réglé : tous les postes lisent et écrivent la même base, chaque appel est visible partout en moins d\'une minute, automatiquement. « Envoyer mon activité » reste disponible pour partager un fichier si un poste n\'a pas de réseau.',sel:'#bserv'},
 {v:'tableau',open:'assist',t:'Le robot de recherche',p:'Le bouton rond en bas à droite répond à vos questions et ouvre les fiches trouvées : « hôtellerie », « La Réunion », « NRP », « appels à passer », un nom… Essayez « bilan » pour l\'état de la base.',sel:'.apane'}
];
let tourI=-1;
function tourClean(){document.querySelectorAll('.tour-hi').forEach(e=>e.classList.remove('tour-hi'));const t=document.getElementById('tour');if(t)t.remove();}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function tourStep(i){
  tourClean();closeModal();closeDrawer();closeAssist();closeElig();
  if(i<0||i>=TOUR.length){tourI=-1;if(i>=TOUR.length){view='tableau';render();toast('Bonne prospection. Pense bien, tout ira bien.');}return;}
  tourI=i;const s=TOUR[i];
  if(view!==s.v){view=s.v;render();}
  await pause(260);if(tourI!==i)return;
  if(s.open==='fiche'){const f=filtrer()[0]||fiches[0];if(f)detail(f.id);}
  else if(s.open==='nouveau')formClient();
  else if(s.open==='menu')openDrawer();
  else if(s.open==='assist')openAssist();
  await pause(320);if(tourI!==i)return;
  let el=document.querySelector(s.sel);
  if(el&&s.sel==='#dst')el=el.closest('section')||el;
  if(el&&s.sel==='#n_prenom')el=el.closest('.cols')||el;
  if(el){el.classList.add('tour-hi');try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}
  const d=document.createElement('div');d.className='tour';d.id='tour';
  d.innerHTML=`<div class="tstep">Étape ${i+1} sur ${TOUR.length}</div><h3>${s.t}</h3><p>${s.p}</p><div class="tbtns">${i>0?'<button class="btn g sm" id="tprev">Précédent</button>':''}<button class="btn sm" id="tnext">${i===TOUR.length-1?'Terminer':'Suivant'}</button><button class="btn g sm" id="tquit" style="margin-left:auto">Quitter</button></div><label class="tnever"><input type="checkbox" id="tnever"> Ne plus jamais afficher cette prise en main</label>`;
  document.body.appendChild(d);
  document.getElementById('tnext').onclick=()=>tourStep(i+1);
  const p=document.getElementById('tprev');if(p)p.onclick=()=>tourStep(i-1);
  document.getElementById('tquit').onclick=()=>tourStep(-1);
  document.getElementById('tnever').onchange=async ev=>{if(!ev.target.checked)return;await masquerTour(true);tourStep(-1);toast('C\'est noté : la prise en main ne s\'affichera plus. Menu → Prise en main pour la revoir.');};
}
function startTour(){tourStep(0);}

/* ---------- pages ---------- */

  <h2>Qui nous sommes</h2>
  <p>Implantés depuis des années dans les DOM-TOM, accompagnés par des géants du marché national, nous sommes les meilleurs dans notre domaine : matériel disponible avant le marché, installation dans des délais très courts, dossiers CEE menés de bout en bout.</p>
  <h2>Pourquoi elle vaut de l'or</h2>
  <p>Ces clients ont déjà signé un dossier CEE. Ils connaissent le dispositif, ils ont un historique, et leur secteur d'activité détermine les fiches auxquelles ils sont encore éligibles. Une base de clients convaincus vaut mille fichiers de prospection froide.</p>
  <h2>L'enrichissement</h2>
  <p>Le code NAF officiel, récupéré auprès de l'INSEE, donne le secteur réel de chaque entreprise. C'est la clé du croisement avec le catalogue des fiches CEE : un hôtel, une exploitation agricole et un garage n'ouvrent pas les mêmes droits.</p></div>`;}
function vAide(){return `<div class="page"><h1>Guide</h1><p><button class="btn" id="bTour">Lancer la visite guidée</button> <span class="sm mut">sept étapes, sur les vraies pages</span></p>
  <h2>Information CEE</h2><p>Menu → Information CEE : pour chaque fiche à travailler, les questions qui rendent un prospect éligible ou non, sans montant ni calcul. Cochez les réponses pendant l'appel, le verdict s'affiche (éligible sur le papier, qualification en cours, non éligible) et se colle dans la note d'appel. Le même questionnaire s'ouvre depuis une fiche client, sous « Fiche CEE proposée ».</p>
  <h2>0. Serveur d'équipe</h2><p>Le serveur d'équipe est déjà réglé dans DomBase : dès l'ouverture, ce poste lit et écrit la même base que tous les autres. Chaque appel, statut, rappel, questionnaire ou enrichissement est envoyé au moment où vous l'enregistrez, et les nouveautés des collègues arrivent toutes les 45 secondes. Rien à faire au quotidien : le point « ● équipe » en haut confirme la connexion ; s'il passe au rouge, le poste continue seul et se resynchronise dès le retour du réseau.</p><h2>1. Prise en charge</h2><p>Dans chaque fiche, « Pris en charge par » indique qui suit ce client et « Dernier appel » qui l'a appelé en dernier : avant d'appeler, regardez ces deux mentions pour ne pas rappeler un client déjà traité par un collègue.</p><h2>1. Enrichir</h2><p>À faire depuis l'adresse internet de DomBase, dans Safari ou Chrome. Onglet Enrichissement, bouton Lancer. La plateforme interroge le registre national entreprise par entreprise et enregistre chaque résultat directement dans la base : les secteurs apparaissent aussitôt dans Base clients. Vous pouvez changer d'onglet, le traitement continue (une barre en haut l'indique), et vous pouvez l'arrêter et le reprendre à tout moment. L'export Excel n'est qu'une sauvegarde : rien à réimporter.</p>
  <h2>2. Arbitrer</h2><p>Quand plusieurs entreprises portent le même nom dans le département, elles vous sont proposées côte à côte avec leur adresse et leur activité. Un clic tranche.</p>
  <h2>3. Filtrer</h2><p>Onglet Base clients : secteur, territoire, statut, source. Les cases du tableau de bord sont cliquables et appliquent le filtre correspondant.</p>
  <h2>4. Travailler</h2><p>Ouvrez une fiche, changez son statut, notez vos appels. Sélectionnez plusieurs lignes pour changer le statut en lot ou exporter une liste d'appel.</p>
  <h2>5. Importer</h2><p>Onglet Base clients, bouton Importer un fichier. Excel ou CSV, une feuille à la fois. Les colonnes sont reconnues automatiquement et modifiables. Vous choisissez la fiche CEE installée et le type de lead pour tout le fichier. Les doublons (même SIRET, SIREN ou téléphone) sont écartés.</p><h2>6. Exporter</h2><p>Bouton Exporter, dans la base ou dans l'enrichissement. Le fichier Excel contient tout, secteurs et codes NAF inclus.</p></div>`;}

/* ---------- assistant ---------- */
const SUGG=['Appels à passer','À rappeler','Hôtellerie','La Réunion','BAT-EQ-127'];
let chat=[];
function repondre(txt){
  let n=norm(txt);
  const sing=t=>t.split(' ').map(w=>w.length>4&&w.endsWith('s')?w.slice(0,-1):w).join(' ');
  const ns=sing(n);
  const lig=f=>({id:f.id,label:nomClient(f),sub:[f.territoire,f.secteur,f.type_lead].filter(Boolean).join(' · ')});
  const secteurs=[...new Set(fiches.map(f=>f.secteur).filter(Boolean))];
  if(/eligib|question|information cee|qualifier un prospect/.test(n)){return{t:'Les questions d\'éligibilité par fiche sont dans le menu → Information CEE, et dans chaque fiche client sous « Fiche CEE proposée ».',items:[]};}
  if(/effectif|salari|employ/.test(n)){const l=fiches.filter(f=>f.effectif&&(/^\d+$/.test(f.effectif)?+f.effectif>=10:!/0 à 9/.test(f.effectif)));return{t:`${l.length} entreprises de 10 salariés ou plus.`,items:l.slice(0,40).map(f=>({id:f.id,label:nomClient(f),sub:[f.territoire,f.secteur,f.effectif].filter(Boolean).join(' · ')}))};}
  if(/rappel|a appeler|appels/.test(n)){const l=fiches.filter(f=>f.rappel&&f.rappel<=AUJ()&&f.statut!=='Ne pas recontacter');return{t:`${l.length} appel${l.length>1?'s':''} à passer aujourd'hui ou en retard.`,items:l.slice(0,40).map(lig)};}
  {const sy=Object.keys(SECT_SYN).find(k=>n.includes(k));if(sy&&!SECTEURS_LISTE.some(s=>n.includes(norm(s)))){const sec=SECT_SYN[sy];const l=fiches.filter(f=>f.secteur===sec||(f.autres||[]).some(a=>a.secteur===sec));return{t:`${l.length} fiches en ${sec}.`,items:l.slice(0,40).map(lig)};}}
  if(/qualifier|sans secteur|sans naf|manque|inconnu/.test(n)){const l=fiches.filter(f=>!f.secteur);return{t:`${l.length} fiches sans secteur. Lancez l'enrichissement pour les traiter.`,items:l.slice(0,20).map(lig)};}
  const sect=secteurs.find(s=>n.includes(norm(s))||ns.includes(sing(norm(s)))||(n.split(' ')[0].length>4&&norm(s).includes(n.split(' ')[0])));
  if(sect){const l=fiches.filter(f=>f.secteur===sect||(f.autres||[]).some(a=>a.secteur===sect));return{t:`${l.length} fiches en ${sect}.`,items:l.slice(0,40).map(lig)};}
  const terrs=[...new Set(fiches.map(f=>f.territoire).filter(Boolean))];
  const terr=terrs.find(t=>n.includes(norm(t)));
  if(terr){const l=fiches.filter(f=>f.territoire===terr);const s={};l.forEach(f=>{const k=f.secteur||'à qualifier';s[k]=(s[k]||0)+1;});
    const top=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>k+' '+v).join(', ');
    return{t:`${l.length} fiches en ${terr}. Principaux secteurs : ${top}.`,items:l.slice(0,40).map(lig)};}
  const ty=TYPES.find(s=>n.includes(norm(s))||ns.includes(sing(norm(s))));
  if(ty){const l=fiches.filter(f=>f.type_lead===ty);return{t:`${l.length} fiches ${ty.toLowerCase()}${ty==='Installé'?'es':'s'}.`,items:l.slice(0,40).map(lig)};}
  const mfi=txt.toUpperCase().match(/\b(AGRI|BAR|BAT|IND|RES|TRA)-?\s?([A-Z]{2})-?\s?(\d{3})\b/);
  if(mfi){const code=mfi[1]+'-'+mfi[2]+'-'+mfi[3];const l=fiches.filter(f=>(f.ops||[]).some(o=>o.fiche===code));return{t:`${code} — ${ficheTitre(code)}. ${l.length} client${l.length>1?'s':''}.`,items:l.slice(0,40).map(lig)};}
  const st=STATUTS.find(s=>n.includes(norm(s))||ns.includes(sing(norm(s))));
  if(st){const l=fiches.filter(f=>(f.statut||'Non traité')===st);return{t:`${l.length} fiches au suivi « ${st} ».`,items:l.slice(0,40).map(lig)};}
  if(/bilan|resume|etat|point/.test(n)){const e=fiches.filter(f=>f.naf).length;
    return{t:`${fiches.length} fiches, ${e} enrichies, ${fiches.filter(f=>f.tel).length} avec téléphone, ${fiches.filter(f=>f.statut==='Dossier signé').length} dossiers signés.`,items:[]};}
  const mots=n.split(' ').filter(w=>w.length>2);
  if(mots.length){const l=fiches.filter(f=>{const h=norm([nomClient(f),f.nom,f.prenom,f.raison_sociale,f.ville,f.tel,f.siren,f.siret].join(' '));return mots.every(w=>h.includes(w));});
    if(l.length)return{t:l.length===1?`${nomClient(l[0])} — ${[l[0].ville,l[0].secteur,l[0].tel].filter(Boolean).join(' · ')}.`:`${l.length} résultats.`,items:l.slice(0,40).map(lig)};}
  return{t:'Rien trouvé. Essayez un secteur, un territoire, un nom ou « bilan ».',items:[]};
}
function openAssist(){
  const d=document.getElementById('assist');
  d.innerHTML=`<div class="aovl" id="aovl"><div class="apane" onclick="event.stopPropagation()">
    <div class="ahead"><b>Recherche</b><span class="xs mut">réponses courtes</span><button class="x" id="ax" style="margin-left:auto">×</button></div>
    <div class="abody" id="abody"></div>
    <div class="asugg">${SUGG.map(s=>`<span class="chip" data-sg="${esc(s)}">${esc(s)}</span>`).join('')}</div>
    <div class="ain"><input type="text" id="aq" placeholder="Un secteur, un territoire, un nom…"><button class="btn" id="ago">→</button></div>
  </div></div>`;
  document.getElementById('aovl').onclick=closeAssist;document.getElementById('ax').onclick=closeAssist;
  const go=()=>{const el=document.getElementById('aq');const v=el.value.trim();if(!v)return;el.value='';chat.push({r:'u',t:v});chat.push({r:'a',...repondre(v)});drawChat();};
  document.getElementById('ago').onclick=go;
  document.getElementById('aq').onkeydown=e=>{if(e.key==='Enter')go();};
  d.querySelectorAll('[data-sg]').forEach(c=>c.onclick=()=>{chat.push({r:'u',t:c.dataset.sg});chat.push({r:'a',...repondre(c.dataset.sg)});drawChat();});
  drawChat();
}
function drawChat(){
  const b=document.getElementById('abody');if(!b)return;
  b.innerHTML=chat.length?chat.map(m=>m.r==='u'?`<div class="amsg u">${esc(m.t)}</div>`:
   `<div class="amsg a">${esc(m.t)}${m.items&&m.items.length?`<div class="ares">${m.items.slice(0,8).map(i=>`<div class="ait" data-open="${i.id}"><b>${esc(i.label)}</b><span>${esc(i.sub)}</span></div>`).join('')}${m.items.length>8?`<div class="xs mut" style="padding:4px 2px">+ ${m.items.length-8} autres</div>`:''}</div>`:''}</div>`).join('')
   :`<div class="avide">Posez une question sur la base.<br><span class="xs">« hôtellerie », « Martinique », « prospects », un nom de société</span><br><br><i class="xs" style="color:var(--bleu)">Pense bien, tout ira bien.</i></div>`;
  b.scrollTop=b.scrollHeight;
  b.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{closeAssist();setTimeout(()=>detail(e.dataset.open),200);});
}
function closeAssist(){const d=document.getElementById('assist'),o=d.querySelector('.aovl');if(!o)return;o.classList.add('closing');setTimeout(()=>d.innerHTML='',200);}

/* ---------- événements ---------- */
function bind(){
  const on=(i,ev,fn)=>{const e=document.getElementById(i);if(e)e.addEventListener(ev,fn);};
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('.ck'))return;detail(e.dataset.open);});
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{view=e.dataset.go;render();});
  document.querySelectorAll('[data-elig]').forEach(b=>b.onclick=()=>openElig(b.dataset.elig));
  on('bTour','click',startTour);
  on('bInteg','click',async()=>{const l=fiches.filter(f=>f.naf);l.forEach(f=>{recalc(f);f._dirty=true;});await save();let msg=l.length+' fiches enrichies intégrées dans la base clients';if(Serveur.actif()){try{const n=await Serveur.pousser();msg+=' · '+n+' synchronisées avec l\'équipe';}catch(e){msg+=' · serveur injoignable, synchronisation au prochain passage';}}toast(msg);fEnr='sect';pageN=60;view='base';render();});
  document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.f,v=e.dataset.val;
    if(k==='sect')fSect=v;else if(k==='terr')fTerr=v;else if(k==='stat')fStat=v;else if(k==='src')fSrc=v;else if(k==='enr')fEnr=v;else if(k==='fiche')fFiche=v;else if(k==='type')fType=v;else if(k==='visee')fVisee=v;else if(k==='rappel')fEnr='rappel';
    pageN=60;view='base';render();});
  document.querySelectorAll('[data-sort]').forEach(t=>t.onclick=()=>{if(sortKey===t.dataset.sort)sortDir=-sortDir;else{sortKey=t.dataset.sort;sortDir=1;}render();});
  on('q','input',e=>{q=e.target.value;pageN=60;const p=e.target.selectionStart;render();const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p);}});
  on('fs','change',e=>{fSect=e.target.value;pageN=60;render();});
  on('ft','change',e=>{fTerr=e.target.value;pageN=60;render();});
  on('fst','change',e=>{fStat=e.target.value;pageN=60;render();});
  on('fsr','change',e=>{fSrc=e.target.value;pageN=60;render();});on('ffi','change',e=>{fFiche=e.target.value;pageN=60;render();});on('fty','change',e=>{fType=e.target.value;pageN=60;render();});
  on('fclear','click',()=>{q='';fSect='';fTerr='';fStat='';fSrc='';fEnr='';fFiche='';fType='';fVisee='';pageN=60;render();});
  document.querySelectorAll('[data-rm]').forEach(e=>e.onclick=()=>{const k=e.dataset.rm;({q:()=>q='',sect:()=>fSect='',terr:()=>fTerr='',fiche:()=>fFiche='',type:()=>fType='',stat:()=>fStat='',src:()=>fSrc='',enr:()=>fEnr='',visee:()=>fVisee=''})[k]();pageN=60;render();});
  on('fexp','click',()=>exportXLSX(filtrer(),'dombase-export.xlsx'));
  on('fimp','click',showImport);
  on('bmore','click',()=>{pageN+=60;render();});
  on('terrMore','click',()=>{const e=document.getElementById('terrExtra');e.style.display=e.style.display==='none'?'':'none';});
  on('ckAll','click',e=>{const l=filtrer().slice(0,pageN);if(e.target.checked)l.forEach(f=>sel.add(f.id));else l.forEach(f=>sel.delete(f.id));render();});
  document.querySelectorAll('[data-ck]').forEach(c=>c.onclick=e=>{e.stopPropagation();if(c.checked)sel.add(c.dataset.ck);else sel.delete(c.dataset.ck);render();});
  on('bclr','click',()=>{sel.clear();render();});
  on('bexp','click',()=>exportXLSX(fiches.filter(f=>sel.has(f.id)),'liste-appel.xlsx'));
  on('bulk','change',async e=>{const s=e.target.value;if(!s)return;fiches.forEach(f=>{if(sel.has(f.id))f.statut=s;});await save();toast(sel.size+' fiches → '+s);sel.clear();render();});
  on('bgo','click',lancerEnrich);
  on('bdedup','click',async()=>{const avant=fiches.length;const n=dedoublonner();await save();render();toast(n?n+' doublons fusionnés · '+avant+' → '+fiches.length+' fiches':'Aucun doublon : '+fiches.length+' fiches uniques');});
  on('bRetry','click',async()=>{fiches.forEach(f=>{if(f.enrich_etat==='introuvable')f.enrich_etat='';});await save();render();});
  on('rgo','click',rechercheLibre);on('rq','keydown',e=>{if(e.key==='Enter')rechercheLibre();});

  on('bstop','click',()=>{arret=true;toast('Arrêt demandé');});
  on('bexpx','click',()=>exportXLSX(fiches,'dombase-complet.xlsx'));
  document.querySelectorAll('[data-q]').forEach(el=>el.onclick=async()=>{
    const it=enrichFile[+el.dataset.q];const choisi=it.cands[+el.dataset.j];
    appliquerEntreprise(it.f,choisi);it.f.enrich_etat='';
    if(it.f.autres)it.f.autres=it.f.autres.filter(a=>a.siren!==choisi.siren);
    enrichFile.splice(+el.dataset.q,1);await save();render();toast('Fiche enrichie');});
  document.querySelectorAll('[data-skip]').forEach(el=>el.onclick=async()=>{const it=enrichFile[+el.dataset.skip];it.f.enrich_etat='introuvable';enrichFile.splice(+el.dataset.skip,1);await save();render();});
  document.querySelectorAll('[data-lier]').forEach(el=>el.onclick=async()=>{const it=enrichFile[+el.dataset.lier];lierSociete(it.f,it.cands[+el.dataset.j]);await save();render();toast('Structure rattachée');});
}
document.getElementById('hlogo').src=LOGO_SMALL;
document.getElementById('hlogo').style.cursor='pointer';document.getElementById('hlogo').onclick=()=>{view='tableau';render();};
const _lg=document.getElementById('hlogotxt');if(_lg){_lg.style.cursor='pointer';_lg.onclick=()=>{view='tableau';render();};}
document.getElementById('bMenu').onclick=openDrawer;
document.getElementById('bNew').onclick=formClient;
document.getElementById('bAssist').onclick=openAssist;
document.getElementById('bOut').onclick=async()=>{user=null;try{await Store.del(KS);}catch(e){}gateOut();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(tourI>=0)tourStep(-1);else{closeModal();closeDrawer();closeAssist();closeElig();}}});
(async()=>{
  let s=null;try{s=await Store.get(KS);}catch(e){}
  const connu=s&&ACCES.find(a=>a.login===s.login);
  if(!connu)gate();
  try{await load();}catch(e){}
  await Serveur.charger();
  if(connu){user={login:connu.login,nom:connu.nom};enter();}
  if(Serveur.actif()){try{const n=await Serveur.tirer();await Serveur.pousser();if(n&&user)render();}catch(e){}Serveur.demarrer();Serveur.majBadge();}
})();
